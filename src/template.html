<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do List</title>
</head>
<body>
    <aside id="projectsSidebar">
        <button id="addProject">Add Project</button>
        <dialog id="dialogProject">
            <form action="./main.js" method="dialog">
                <label for="inputTitlePJ">What name would you like for this project?</label>
                <input required type="text" name="title" id="inputTitlePJ">
                <button id="createProject">Create Project</button>
                <button id="cancelProject" class="cancelBtn" type="button">Cancel Project</button>
            </form>
        </dialog>
        <ul id="displayedProjects">
        </ul>
    </aside>
    <div id="todosContainer">
        <button id="addTodo">Add Todo</button>
        <div id="todosList"></div>
        <dialog id="dialogTodo">
            <form action="./main.js" method="dialog">
                <label for="inputTitleTD">Title</label>
                <input required type="text" id="inputTitleTD" name="title">
                <label for="inputDesc">Description</label>
                <input type="text" id="inputDesc" name="description">
                <label for="inputDate">Due Date</label>
                <input required type="date" id="inputDate" name="date">
                <fieldset>
                <legend>Select a priority:</legend>
                    <div>
                        <input type="radio" id="inputLow" name="priority" value="1" checked />
                        <label for="inputLow">Low</label>
                    </div>
                    <div>
                        <input type="radio" id="inputMedium" name="priority" value="2" />
                        <label for="inputMedium">Medium</label>
                    </div>
                    <div>
                        <input type="radio" id="inputHigh" name="priority" value="3" />
                        <label for="inputHigh">High</label>
                    </div>
                </fieldset>
                <button id="createTodo">Create Todo</button>
                <button id="cancelTodo" type="button" class="cancelBtn">Cancel Todo</button>
            </form>
        </dialog>
        <dialog id="dialogEditTodo">
            <form action="./main.js" method="dialog">
                <label for="editTitleTD">Edit Title</label>
                <input required type="text" id="editTitleTD" name="title">
                <label for="editDesc">Edit Description</label>
                <input type="text" id="editDesc" name="description">
                <label for="editDate">Edit Due Date</label>
                <input required type="date" id="editDate" name="date">
                <fieldset>
                <legend>Select a priority:</legend>
                    <div>
                        <input type="radio" id="editLow" name="editPriority" value="1" />
                        <label for="editLow">Low</label>
                    </div>
                    <div>
                        <input type="radio" id="editMedium" name="editPriority" value="2" />
                        <label for="editMedium">Medium</label>
                    </div>
                    <div>
                        <input type="radio" id="editHigh" name="editPriority" value="3" />
                        <label for="editHigh">High</label>
                    </div>
                </fieldset>
                <button id="saveEditTodo">Save Changes</button>
                <button id="cancelEditTodo" type="button" class="cancelBtn">Cancel</button>
            </form>
        </dialog>
    </div>
</body>
</html>
