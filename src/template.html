<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do List</title>
</head>
<body>
    <aside id="projects-sidebar">
        <button id="btnCreateProject">Create Project</button>
        <dialog>
            <form action="./main.js" method="dialog">
                <label for="title"></label>
                <input type="text" name="title" id="inputTitlePJ">
                <button id="btnAddProject">Add Project</button>
                <button id="btnCancelProject" type="button">Cancel Project</button>
            </form>
        </dialog>
    </aside>
    <div id="todos-container">
        <button id="btnCreateTodo"></button>
        <dialog>
            <form action="./main.js" method="dialog">
                <label for="title"></label>
                <input type="text" id="inputTitleTD" name="title">
                <label for="description"></label>s
                <input type="text" id="inputDesc" name="description">
                <label for="date"></label>
                <input type="date" id="inputDate" name="date">
                <fieldset>
                <legend>Select a priority:</legend>
                    <div>
                        <input type="radio" id="inputLow" name="priority" value="1" checked />
                        <label for="1">Low</label>
                    </div>
                    <div>
                        <input type="radio" id="inputMedium" name="priority" value="2" />
                        <label for="2">Medium</label>
                    </div>
                    <div>
                        <input type="radio" id="inputHigh" name="priority" value="3" />
                        <label for="3">High</label>
                    </div>
                </fieldset>
                <button id="btnAddTodo">Add Todo</button>
                <button id="btnCancelTodo" type="button">Cancel Todo</button>
            </form>
        </dialog>
    </div>
</body>
</html>
