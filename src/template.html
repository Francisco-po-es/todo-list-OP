<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do List</title>
</head>
<body>
    <aside id="projectsSidebar">
        <button id="addProject">Add Project</button>
        <dialog id="dialogProject">
            <form action="./main.js" method="dialog">
                <label for="title">What name would you like for this project?</label>
                <input required type="text" name="title" id="inputTitlePJ">
                <button id="createProject">Create Project</button>
                <button id="cancelProject" class="cancelBtn" type="button">Cancel Project</button>
            </form>
        </dialog>
    </aside>
    <div id="todosContainer">
        <button id="addTodo">Add Todo</button>
        <dialog id="dialogTodo">
            <form action="./main.js" method="dialog">
                <label for="title">Title</label>
                <input type="text" id="inputTitleTD" name="title">
                <label for="description">Description</label>
                <input type="text" id="inputDesc" name="description">
                <label for="date">Due Date</label>
                <input type="date" id="inputDate" name="date">
                <select id="selectProject" name="project"></select>
                <fieldset>
                <legend>Select a priority:</legend>
                    <div>
                        <input type="radio" id="inputLow" name="priority" value="1" checked />
                        <label for="1">Low</label>
                    </div>
                    <div>
                        <input type="radio" id="inputMedium" name="priority" value="2" />
                        <label for="2">Medium</label>
                    </div>
                    <div>
                        <input type="radio" id="inputHigh" name="priority" value="3" />
                        <label for="3">High</label>
                    </div>
                </fieldset>
                <button id="createTodo">Create Todo</button>
                <button id="cancelTodo" type="button" class="cancelBtn" >Cancel Todo</button>
            </form>
        </dialog>
    </div>
</body>
</html>
